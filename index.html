<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>ShopKart</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->

    <header class="navbar">

        <div class="logo">
            🛍️ <span>ShopKart</span>
        </div>

        <div class="search-box">
            <input type="text" placeholder="Search products...">
            <button>🔍</button>
        </div>

        <nav>
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Categories</a>
            <a href="#">Cart 🛒</a>
            <a href="#">Login</a>
        </nav>

    </header>

    <!-- Hero Section -->

    <section class="hero">

        <h2>🔥 Flat 50% OFF</h2>

        <p>Welcome to ShopKart - Your Online Shopping Destination</p>

        <button>Shop Now</button>

    </section>

    <!-- Featured Products -->

    <section class="products">

        <h2>Featured Products</h2>

        <div class="product-container">

            <div class="product-card">
                <img src="images/iphone.jpg" alt="iPhone 17">
                <h3>📱 iPhone 17</h3>
                <p>₹89,999</p>
                <button>Add to Cart</button>
            </div>

            <div class="product-card">
                <img src="images/laptop.jpg" alt="Laptop">
                <h3>💻 Laptop</h3>
                <p>₹59,999</p>
                <button>Add to Cart</button>
            </div>

            <div class="product-card">
                <img src="images/watch.jpg" alt="Smart Watch">
                <h3>⌚ Smart Watch</h3>
                <p>₹4,999</p>
                <button>Add to Cart</button>
            </div>

            <div class="product-card">
                <img src="images/headphones.jpg" alt="Headphones">
                <h3>🎧 Headphones</h3>
                <p>₹1,999</p>
                <button>Add to Cart</button>
            </div>

        </div>

    </section>

</body>

</html>
